name: Vault Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vault-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.x"

      - name: Validate .mcp.json
        run: python3 -c "import json; json.load(open('.mcp.json'))"

      - name: Check for broken wikilinks
        run: python3 scripts/check-links.py

      - name: Guard against committed secrets / build output
        run: ./scripts/guard-secrets.sh

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh .githooks/pre-commit
