name: Vault Check

# The vault's health rules are enforced in three places, weakest to strongest:
# templates suggest, `vault_stats.py` reports, and this workflow blocks. Rules an
# agent has to remember degrade over a long session — see ADR-0004.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vault-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Frontmatter parses, links quoted, keys snake_case
        run: python3 90-System/Scripts/check_frontmatter.py

      - name: No broken wikilinks, every note describes itself
        run: python3 90-System/Scripts/vault_stats.py --check

      - name: Knowledge graph builds
        run: python3 90-System/Scripts/brain_graph.py build

      - name: Derived data stayed out of git
        run: |
          # 90-System/Graph/ and Search Index/ are per-machine and gitignored on
          # purpose; committing them produces endless cross-machine conflicts.
          if git ls-files --error-unmatch \
              '90-System/Graph/*' '90-System/Search Index/*' >/dev/null 2>&1; then
            echo "FAIL — derived graph or search-index files are tracked in git."
            git ls-files '90-System/Graph/*' '90-System/Search Index/*'
            exit 1
          fi
          echo "PASS — no derived data tracked."

      - name: No secrets committed
        run: |
          if git ls-files | grep -Ei '\.(pem|key|p12|pfx)$|(^|/)\.env$'; then
            echo "FAIL — credential-shaped files are tracked in git."
            exit 1
          fi
          if git grep -nEI \
              '(sk-ant-[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9]{32,}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY)' \
              -- ':!.github/workflows/*'; then
            echo "FAIL — something matching a credential shape is committed."
            exit 1
          fi
          echo "PASS — no credential shapes found."
