name: Vault Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vault-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.x"

      # check_frontmatter.py is the only step needing a non-stdlib import; it
      # uses a real YAML parser deliberately, since the bug it catches is one
      # the vault's own hand-rolled parser would reproduce rather than detect.
      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      # An unquoted [[wikilink]] is invalid YAML, so Obsidian and every script
      # silently drop the whole frontmatter block — the note looks fine in the
      # editor and is invisible to the graph. Also enforces snake_case keys.
      - name: Frontmatter parses, links quoted, keys snake_case
        run: python3 "90-System/Scripts/check_frontmatter.py"

      # Enforcing counterpart to vault_stats.py, which only reports and always
      # exits 0. Fails the build with file:line for every dangling [[link]].
      - name: Check for broken wikilinks
        run: python3 "90-System/Scripts/check_links.py"

      # Both bugs these pin were silent under-reporters: brain_graph's parser
      # dropped every multi-value typed edge, and vault_stats collapsed all
      # seven _Index.md files into one. Discovery picks up new suites for free.
      - name: Script regression tests
        run: python3 -m unittest discover -s "90-System/Scripts" -p "test_*.py" -v

      # Catches an outright broken script, which the tests above would miss.
      - name: Graph builds cleanly
        run: python3 "90-System/Scripts/brain_graph.py" build

      - name: Guard against committed secrets
        run: ./90-System/Scripts/guard-secrets.sh

      # 90-System/Graph/ and Search Index/ are rebuilt per machine and gitignored
      # on purpose. Committing them produces endless laptop-vs-desktop conflicts
      # on files nobody reads — cheap to check, tedious to undo.
      - name: Derived data stayed out of git
        run: |
          if git ls-files --error-unmatch \
              '90-System/Graph/*' '90-System/Search Index/*' >/dev/null 2>&1; then
            echo "FAIL — derived graph or search-index files are tracked in git."
            git ls-files '90-System/Graph/*' '90-System/Search Index/*'
            exit 1
          fi
          echo "PASS — no derived data tracked."

      # Vendored third-party scripts under .claude/skills/ are deliberately not
      # linted — they are not ours to fix, and ADR-0005 pins them verbatim.
      - name: Lint our shell scripts
        run: shellcheck 90-System/Scripts/*.sh .claude/hooks/*.sh
